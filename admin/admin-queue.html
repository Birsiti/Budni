(function(){
  var tg = window.Telegram && window.Telegram.WebApp;
  var ov = '';
  try { var p = JSON.parse(localStorage.getItem('budni_prefs') || '{}'); if (p.theme === 'light' || p.theme === 'dark') ov = p.theme; } catch(e){}
  var scheme = ov || ((tg && tg.colorScheme) ? tg.colorScheme
    : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
  document.documentElement.setAttribute('data-theme', scheme);
})();
</script>
