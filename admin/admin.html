<!DOCTYPE html>
<!-- изменено 2026-09-07 11:11 -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Будни_BY · Админ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="admin.css">

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
(function(){
  var tg = window.Telegram && window.Telegram.WebApp;
  var ov = '';
  try { var p = JSON.parse(localStorage.getItem('budni_prefs') || '{}'); if (p.theme === 'light' || p.theme === 'dark') ov = p.theme; } catch(e){}
  var scheme = ov || ((tg && tg.colorScheme) ? tg.colorScheme
    : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
  document.documentElement.setAttribute('data-theme', scheme);
})();
</script>
</head>
<body>

<div id="gate" class="gate hidden">
  <h1>Будни_BY · Админ</h1>
  <p>Вставь токен моста (тот же, что в BUDNI_BRIDGE_TOKEN) — сохранится только в этом браузере.</p>
  <input type="text" id="tokenInput" placeholder="токен" autocomplete="off">
  <button class="btn" id="tokenSave">Сохранить</button>
</div>

<div id="app" class="hidden">
  <div class="topbar">
    <div class="topbar-head">
      <h1>Будни_BY · Админ</h1>
      <button class="icon-btn-round" id="settingsBtn" aria-label="Настройки">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
        </svg>
      </button>
    </div>
    <div class="settings-pop hidden" id="settingsPop"></div>
  </div>

  <div class="content">
    <button class="pause-toggle wide" id="pauseToggle" aria-label="Переключить публикацию">
      <span class="dot"></span><span id="pauseLabel">Публикация: идёт</span>
    </button>

    <div class="hub-grid">
      <a href="admin-moderation.html" class="hub-tile"><div class="hub-n" id="hubMod">–</div><div class="hub-l">Модерация</div></a>
      <a href="admin-queue.html" class="hub-tile"><div class="hub-n" id="hubQueue">–</div><div class="hub-l">Очередь</div></a>
      <a href="admin-sources.html" class="hub-tile"><div class="hub-n" id="hubSrc">–</div><div class="hub-l">Источники · на рассмотрении</div></a>
      <a href="admin-stats.html" class="hub-tile"><div class="hub-n" id="hubToday">–</div><div class="hub-l">Опубликовано сегодня</div></a>
    </div>
    <div class="hub-line" id="hubLine">Загрузка…</div>
  </div>
</div>

<script src="../app.js"></script>
<script src="../settings.js"></script>
<script src="admin-core.js"></script>
<script>
// ---- хаб ----
var _hubPaused = false;

function renderPause(p) {
  _hubPaused = p;
  document.getElementById('pauseToggle').classList.toggle('is-paused', p);
  document.getElementById('pauseLabel').textContent = p ? 'Публикация: на паузе' : 'Публикация: идёт';
}

async function loadHub() {
  const line = document.getElementById('hubLine');
  const res = await apiGet('admin_data');
  if (!res.ok) { line.textContent = 'Ошибка: ' + (res.error || 'неизвестная'); return; }
  const s = res.stats || {};
  document.getElementById('hubMod').textContent = (res.suspicious || []).length;
  document.getElementById('hubQueue').textContent = s.queueLength || 0;
  document.getElementById('hubToday').textContent = s.publishedToday || 0;
  renderPause(!!res.paused);
  line.textContent = 'В очереди ' + (s.queueLength || 0) +
    ' · опубликовано всего ' + (s.publishedTotal || 0) +
    ' · темп ' + (res.publishBatch || 1) + '/тик (5 мин)' +
    ((res.publishDailyLimit || 0) ? ' · лимит ' + res.publishDailyLimit + '/сут' : '');

  const sr = await apiPost({ action: 'list_sources' }).catch(function () { return { ok: false }; });
  if (sr.ok) {
    document.getElementById('hubSrc').textContent =
      (sr.sources || []).filter(function (x) { return x.status === 'pending'; }).length;
  }
}

document.getElementById('pauseToggle').addEventListener('click', async function () {
  haptic('light');
  const res = await apiPost({ action: 'set_publish_pause', paused: !_hubPaused });
  if (res.ok) { renderPause(!!res.paused); haptic(_hubPaused ? 'warning' : 'success'); }
  else { await alertAsync('Не удалось: ' + (res.error || '')); }
});

function hubBoot() {
  initTelegram();
  initSettings();
  if (!getToken()) {
    document.getElementById('gate').classList.remove('hidden');
    document.getElementById('tokenSave').addEventListener('click', function () {
      const v = document.getElementById('tokenInput').value.trim();
      if (!v) return;
      saveToken(v);
      document.getElementById('gate').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      loadHub();
    });
    return;
  }
  document.getElementById('app').classList.remove('hidden');
  loadHub();
}
hubBoot();
</script>
</body>
</html>
