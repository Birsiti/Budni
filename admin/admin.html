<!DOCTYPE html>
<!-- изменено 2026-09-09 22:55 -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Будни_BY · Пульт</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="admin.css">

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
(function(){
  var tg = window.Telegram && window.Telegram.WebApp;
  var ov = '';
  try { var p = JSON.parse(localStorage.getItem('budni_prefs') || '{}'); if (p.theme === 'light' || p.theme === 'dark') ov = p.theme; } catch(e){}
  var scheme = ov || ((tg && tg.colorScheme) ? tg.colorScheme
    : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
  document.documentElement.setAttribute('data-theme', scheme);
})();
</script>
</head>
<body>

<div id="gate" class="gate hidden">
  <h1>Будни_BY · Пульт</h1>
  <p>Вставь админ-токен (значение <code>ADMIN_TOKEN</code>) — сохранится только в этом браузере.</p>
  <input type="text" id="tokenInput" placeholder="токен" autocomplete="off">
  <button class="btn" id="tokenSave">Войти</button>
</div>

<div id="app" class="hidden">
  <div class="topbar">
    <div class="topbar-head">
      <h1>Будни_BY · Пульт</h1>
      <button class="icon-btn-round" id="settingsBtn" aria-label="Настройки">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
        </svg>
      </button>
    </div>
    <div class="settings-pop hidden" id="settingsPop"></div>
  </div>

  <div class="content">

    <!-- статус: парсинг + публикация в одну строку -->
    <div class="status-row">
      <button class="status-card" id="parserToggle" aria-label="Переключить парсинг">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="status-title" id="parserLabel">Парсинг</span>
        <span class="status-switch" aria-hidden="true"><i></i></span>
      </button>
      <button class="status-card" id="pauseToggle" aria-label="Переключить публикацию">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="status-title" id="pauseLabel">Публикация</span>
        <span class="status-switch" aria-hidden="true"><i></i></span>
      </button>
    </div>
    <div class="status-line" id="statusLine">—</div>

    <!-- ключевые числа -->
    <div class="stat-grid" id="statGrid">
      <div class="stat-tile"><div class="stat-value mono" id="stVac">–</div><div class="stat-label">вакансий в базе</div></div>
      <div class="stat-tile"><div class="stat-value mono" id="stQueue">–</div><div class="stat-label">в очереди на публикацию</div></div>
    </div>

    <!-- разделы -->
    <div class="nav-row">
      <a href="admin-queue.html" class="nav-tile">
        <span class="nav-n mono" id="navQueue">–</span>
        <span class="nav-l">Очередь<span class="nav-badge hidden" id="navQueueBadge"></span></span>
        <span class="nav-arrow" aria-hidden="true">→</span>
      </a>
      <a href="admin-sources.html" class="nav-tile">
        <span class="nav-n mono" id="navSrc">–</span>
        <span class="nav-l">Источники<span class="nav-badge hidden" id="navSrcBadge"></span></span>
        <span class="nav-arrow" aria-hidden="true">→</span>
      </a>
    </div>

    <div id="view"><div class="empty">Загрузка…</div></div>
  </div>
</div>

<script src="../app.js"></script>
<script src="../settings.js"></script>
<script src="admin-core.js"></script>
<script src="admin-dashboard.js"></script>
<script>dashboardBoot();</script>
</body>
</html>
