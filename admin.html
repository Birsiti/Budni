<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Будни_BY · Админ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="admin.css">

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
(function(){
  var tg = window.Telegram && window.Telegram.WebApp;
  var ov = '';
  try { var p = JSON.parse(localStorage.getItem('budni_prefs') || '{}'); if (p.theme === 'light' || p.theme === 'dark') ov = p.theme; } catch(e){}
  var scheme = ov || ((tg && tg.colorScheme) ? tg.colorScheme
    : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
  document.documentElement.setAttribute('data-theme', scheme);
})();
</script>
</head>
<body>

<div id="gate" class="gate hidden">
  <h1>Будни_BY · Админ</h1>
  <p>Вставь токен моста (тот же, что в BUDNI_BRIDGE_TOKEN) — сохранится только в этом браузере, не отправляется никуда, кроме твоего Apps Script.</p>
  <input type="text" id="tokenInput" placeholder="токен" autocomplete="off">
  <button class="btn" id="tokenSave">Сохранить</button>
</div>

<div id="app" class="hidden">
  <div class="topbar">
    <h1>Будни_BY · Админ</h1>
    <div class="topbar-actions">
      <button class="pause-toggle" id="pauseToggle" aria-label="Переключить публикацию">
        <span class="dot"></span><span id="pauseLabel">Публикация: идёт</span>
      </button>
      <button class="icon-btn-round" id="settingsBtn" aria-label="Настройки">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
        </svg>
      </button>
      <button class="refresh-btn" id="refreshBtn" aria-label="Обновить">↻</button>
    </div>
    <div class="settings-pop hidden" id="settingsPop"></div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabModeration" data-tab="moderation">
      Модерация <span class="count" id="modCount">0</span>
    </button>
    <button class="tab" id="tabSources" data-tab="sources">
      Источники <span class="count" id="srcCount">0</span>
    </button>
    <button class="tab" id="tabStats" data-tab="stats">Статистика</button>
  </div>

  <div class="content">
    <div id="viewModeration"></div>
    <div id="viewSources" class="hidden"></div>
    <div id="viewStats" class="hidden"></div>
  </div>
</div>

<script src="app.js"></script>
<script src="settings.js"></script>
<script src="admin.js"></script>
<script src="admin-moderation.js"></script>
<script src="admin-sources.js"></script>
<script src="admin-stats.js"></script>
<script>boot();</script>
</body>
</html>
